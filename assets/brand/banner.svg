<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title">
  <title id="title">epochalypse: a terminal running dig for a countdown's TXT record on a local epochalypse server, which answers v=epochalypse1 event=2026-12-01T12:00:00Z.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 21px; }
    .name { font-size: 50px; font-weight: 700; fill: #e6edf3; }
    .sub { fill: #8b949e; }
    .prompt { fill: #7ee787; }
    .cmd { fill: #e6edf3; }
    .answer { fill: #ffa657; }
    .cursor { fill: #7ee787; animation: blink 1.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="898" height="248" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text class="name" x="36" y="70">epochalypse</text>
  <text class="sub" x="392" y="68">countdowns, capsules, and switches</text>
  <text x="36" y="118"><tspan class="prompt">$ </tspan><tspan class="cmd">dig @127.0.0.1 -p 8840 +short TXT ce1cc62a….events.lab.invalid.</tspan></text>
  <text class="answer" x="36" y="152">"v=epochalypse1 event=2026-12-01T12:00:00Z"</text>
  <text class="prompt" x="36" y="198">$</text>
  <rect class="cursor" x="60" y="181" width="12" height="22"/>
</svg>
