{
  "name": "CI",
  "on": {
    "pull_request": {
      "branches": ["dev", "main"]
    }
  },
  "permissions": {"contents": "read"},
  "defaults": {"run": {"shell": "bash"}},
  "jobs": {
    "check": {
      "name": "Required checks",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e",
          "with": {"go-version": "1.27.3", "cache": false}
        },
        {
          "name": "Install linter",
          "run": "curl --fail --location --silent --show-error --connect-timeout 10 --max-time 120 --output \"$RUNNER_TEMP/lint.tar.gz\" https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz\nprintf '9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea  %s\\n' \"$RUNNER_TEMP/lint.tar.gz\" | sha256sum --check\nmkdir -p \"$RUNNER_TEMP/lint-bin\"\ntar -xzf \"$RUNNER_TEMP/lint.tar.gz\" -C \"$RUNNER_TEMP/lint-bin\" --strip-components=1 golangci-lint-2.15.0-linux-amd64/golangci-lint"
        },
        {
          "name": "Check workflow contract",
          "run": "python3 .github/tests/test_ci.py"
        },
        {
          "name": "Run required checks",
          "run": "PATH=\"$RUNNER_TEMP/lint-bin:$PATH\" make check"
        }
      ]
    }
  }
}
